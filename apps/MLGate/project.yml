# MLGate: LeanGate for the Core ML export (export/export_coreml.py). Same gate.json / status.json contract, Core ML host.
# Signing: export DEVELOPMENT_TEAM=<your team ID> and BUNDLE_ID_PREFIX=<e.g. com.yourname> before generating.
# Build: apps/MLGate/device.sh install <UDID>.
name: MLGate
options:
  bundleIdPrefix: ${BUNDLE_ID_PREFIX}
  createIntermediateGroups: true
schemes:
  MLGate:
    build:
      targets:
        MLGate: all
    run:
      config: Release
targets:
  MLGate:
    type: application
    supportedDestinations: [iOS]
    deploymentTarget:
      iOS: "18.0"
    sources:
      - path: Sources
    entitlements:
      path: MLGate.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.mlgate
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MLGate.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MLGate
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS: -framework CoreML
