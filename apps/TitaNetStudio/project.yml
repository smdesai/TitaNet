# TitaNet Studio: an interactive iOS app for trying TitaNet-Large on a phone. Compare two voices (microphone or audio
# file) and identify a speaker against enrolled voices, on either runtime: the Core AI bundle or the Core ML export
# (fp32 / fp16c). Both run the host algorithm of tnl/runtime.py (the transcription LeanGate and MLGate measure) behind
# TitaNetKit's NeMo mel front end. No model ships in the app: each runtime's is downloaded from Hugging Face
# (smdesai/TitaNet-Large-CoreAI, smdesai/TitaNet-Large-CoreML) when first selected; Resources holds only the mel
# filterbank and window.
# CoreAI is a system framework, so there is no package dependency.
# Signing: export DEVELOPMENT_TEAM=<your team ID> and BUNDLE_ID_PREFIX=<e.g. com.yourname> before generating.
# Build: apps/TitaNetStudio/build.sh [install <UDID>]
name: TitaNetStudio
options:
  bundleIdPrefix: ${BUNDLE_ID_PREFIX}
  createIntermediateGroups: true
schemes:
  TitaNetStudio:
    build:
      targets:
        TitaNetStudio: all
    run:
      config: Release
targets:
  TitaNetStudio:
    type: application
    supportedDestinations: [iOS]
    deploymentTarget:
      iOS: "27.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.titanetstudio
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # Sources/Assets.xcassets, rendered by make_icon.swift
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: TitaNet Studio
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: TitaNet Studio records your voice to compute a speaker embedding on this device.
        # the unfolded display rotates like an iPad, so every orientation is supported
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS: -framework CoreAI
